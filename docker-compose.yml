# Local PostgreSQL for development.
# Usage:
#   docker compose up -d      # start
#   docker compose down       # stop (keeps data)
#   docker compose down -v    # stop and wipe data
#
# Connection string (see .env.example):
#   postgresql://postgres:postgres@localhost:5432/course_platform?schema=public

services:
  postgres:
    image: postgres:16-alpine
    container_name: course-platform-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: course_platform
    volumes:
      - course_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  course_platform_pgdata:
