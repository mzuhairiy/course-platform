services:
  postgres:
    image: postgres:16-alpine
    container_name: course-platform-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: course_platform
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: course-platform-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      # Port INTERNAL container postgres (5432) — bukan port host (5434).
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/course_platform
      AUTH_SECRET: your-auth-secret-change-this
      NEXT_PUBLIC_APP_URL: http://localhost:3002
      # Opsional — isi kalau butuh:
      # AUTH_GOOGLE_ID: ...
      # AUTH_GOOGLE_SECRET: ...
      # RESEND_API_KEY: ...
      # EMAIL_FROM: ...
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
